name: DrivePad Companion Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion:
    name: Build Linux and Windows Companion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run tests and build distributions
        run: |
          gradle -p companion clean test packageDistributions installDist

      - name: Verify release checksums
        working-directory: companion/build/distributions
        run: sha256sum -c SHA256SUMS.txt

      - name: Upload companion distributions
        uses: actions/upload-artifact@v4
        with:
          name: drivepad-companion-v1.0.0
          path: |
            companion/build/distributions/*
          if-no-files-found: error
          retention-days: 30
